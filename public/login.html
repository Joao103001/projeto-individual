<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <script src="site.js"></script> -->
</head>

<body>
    <section class="container2" id="login">
        <div class="logo-container1">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Palmeiras_logo.svg/2048px-Palmeiras_logo.svg.png"
                alt="Palmeiras Logo" class="logo" />
        </div>
        <h2 id="title">Login</h2>
        <h4>Faça o login para fazer um quiz,<br> e ver quanto você conhece o Palmeiras</h4>
        <div class="usuario">
            <input id="emailNova" placeholder="Usuário"><br><br>
        </div>
        <div class="senha"> <input id="senhaNova" type="password" placeholder="Senha"><br><br></div>
        <!-- <div class="senha1"> <input id="password2" type="password" placeholder="Confirme a senha"><br><br></div> -->

        <div class="botao"> <button onclick="FazerLogin()">Entrar</button></div>

   <a href="cadastro.html">Não tem conta? Cadastre-se</a>
        <!-- <p><a href="../quiz/quiz.html" onclick="FazerLogin()">vamos para o Quiz!!</a></p> -->

    </section>
    <script>
        var email = '';
        var senha = '';
        function FazerLogin() {
            var inputEmail = document.querySelector('#emailNova');
            email = inputEmail.value;
            var inputSenha = document.querySelector('#senhaNova');
            senha = inputSenha.value;

            if (email == "" || senha == "") {
                alert('Preencha todos os campos!')
                return
            }
          else if (!email) {
                console.log("FORM LOGIN: ", email);
                console.log("FORM SENHA: ", senha);
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    senha_hash: senha,
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!");
                console.log('cccc')

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.SENHA_USUARIO = json.senha_hash;
                        sessionStorage.ID_USUARIO = json.idUsuario;
                        

                        alert("Login realizado com sucesso!");
                        window.location = "/EXEMPLO_QUIZZ.html";

                    });
                } else {
                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            });


        }
  function Cadastra() {
    window.location.href = "cadastro.html";}
    </script>
</body>

</html>
